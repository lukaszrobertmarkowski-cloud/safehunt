<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18351f"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><title>Safe Hunt</title></head><body>
<div id="map"></div><div id="brand"><span>SAFE</span> HUNT</div>
<button id="gameToggle" aria-label="Kalendarz polowań">🦌<span>Zwierzyna</span></button>
<aside id="gamePanel"><button id="closeGame">×</button><h2>Zwierzyna – teraz</h2><div id="daylight"></div><div id="gameList"></div><p class="legal">Informacja pomocnicza. Sprawdź aktualne przepisy, plan łowiecki, upoważnienie i lokalne ograniczenia przed polowaniem.</p></aside>
<section id="panel"><div id="status">Naciśnij „Uruchom GPS”</div><div id="distance">— m</div><div id="accuracy">Dokładność GPS: —</div><div class="safeRow"><label for="safeDistance">Bezpieczna odległość</label><div><input id="safeDistance" type="number" min="1" max="5000" step="10" value="150"><span> m</span></div></div><div class="buttons"><button id="start">Uruchom GPS</button><button id="refresh">Odśwież budynki</button></div><small>Dane budynków: OpenStreetMap. Wynik orientacyjny — zależy od dokładności GPS i kompletności mapy.</small></section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></body></html>
